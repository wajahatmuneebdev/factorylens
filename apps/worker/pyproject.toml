[project]
name = "factorylens-worker"
version = "0.0.0"
description = "FactoryLens recorded-video processing worker"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
factorylens-worker = "factorylens_worker.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "mypy",
  "pytest",
  "ruff",
]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
